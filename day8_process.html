<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    Username của bạn là: <span id="id_username"></span><br />
    Password của bạn là: <span id="id_password"></span>

    <script>
        const params = new URLSearchParams(location.search);
        var username = params.get("username");
        var password = params.get("password");

        document.getElementById("id_username").innerText = username;
        document.getElementById("id_password").innerText = password;
    </script>
</body>

</html>
